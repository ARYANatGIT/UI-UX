<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="12" fill="#173F35" />
  <!-- Outer Compass Ring -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#E9DFCE" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
  <!-- Compass Star North-South -->
